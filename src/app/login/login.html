<div class="login-container">

  <div class="login-box">

    <h1>Class Asset</h1>

    <p>Registration System</p>

    <form (ngSubmit)="login()">

      <label>Username</label>

      <input
        type="text"
        [(ngModel)]="username"
        name="username"
        placeholder="Enter username"
        required
      >

      <label>Password</label>

      <input
        type="password"
        [(ngModel)]="password"
        name="password"
        placeholder="Enter password"
        required
      >

      <button type="submit">
        Login
      </button>

    </form>

  </div>

</div>
